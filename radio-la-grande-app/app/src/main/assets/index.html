<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111"><title>La Grande de Huétamo</title>
<style>
:root{--accent:#df1020;--text:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#111}#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.shade{position:fixed;inset:0;background:linear-gradient(180deg,#0002,#0007 48%,#000d);z-index:-1}main{min-height:100vh;padding:28px 20px 110px;display:flex;flex-direction:column;align-items:center;text-align:center}.brand{margin:28px 0 10px;display:flex;flex-direction:column;align-items:center}.brand img{width:185px;height:185px;object-fit:contain;display:none}.brandname{font-weight:900;font-size:28px;color:var(--accent);text-shadow:2px 2px #111,-1px -1px white}h1{font-size:clamp(27px,7vw,38px);margin:14px 0 46px}.live{width:100%;display:flex;align-items:center;gap:12px;letter-spacing:5px;font-weight:bold;margin:0 0 28px}.live:before,.live:after{content:"";height:1px;background:#fff9;flex:1}.play{width:min(100%,380px);border:3px solid #fff;border-radius:60px;padding:19px 24px;background:var(--accent);color:white;font-weight:900;letter-spacing:3px;font-size:21px;display:flex;justify-content:center;gap:18px}.status{margin:18px 0 32px;padding:13px 24px;border:1px solid #ffffff66;border-radius:40px;background:#0007;font-size:16px}h2{font-size:24px;margin:0 0 22px}.links{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}.link{border:1px solid #ffffff75;border-radius:27px;background:#0008;padding:20px 10px;color:white;text-decoration:none;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px}.link.wide{grid-column:1/-1}.ico{font-size:25px}.footer{margin-top:26px;color:#ddd;font-size:15px}nav{position:fixed;bottom:0;left:0;right:0;height:84px;background:#111;display:flex;justify-content:space-around;align-items:center}nav button{border:0;background:transparent;color:#777;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:100px}nav button span{font-size:27px}nav button.active{color:white}nav button.active span{background:var(--accent);border-radius:40px;padding:7px 30px}#chatView{display:none;width:100%;padding-top:50px}#chatView .chatbox{border:1px solid #ffffff66;border-radius:22px;background:#0008;padding:24px;margin-top:20px}#chatView a{color:white}@media(min-width:700px){main{max-width:650px;margin:auto}.link{font-size:20px}}
</style></head><body><img id="bg" alt=""><div class="shade"></div><main>
<section id="homeView" style="width:100%"><div class="brand"><div class="brandname" id="brandTop">LA GRANDE</div><img id="logo" alt="Logo"><div class="brandname" id="brandBottom">HUÉTAMO</div></div>
<h1 id="stationName">La Grande de Huétamo</h1><div class="live">EN VIVO</div><button class="play" id="playBtn" onclick="toggleRadio()"><span id="playIcon">▶</span><span id="playText">ESCUCHAR</span></button><div class="status" id="status">▣ &nbsp; Listo para escuchar</div><h2>Conéctate con nosotros</h2><div class="links" id="links"></div><div class="footer" id="footer">Radio La Grande de Huétamo</div></section>
<section id="chatView"><h1>Chat</h1><div class="chatbox"><p id="chatMessage">Comunícate con nosotros.</p><a id="chatLink" href="#" onclick="return openChat()">Abrir chat</a></div></section></main>
<nav><button id="homeTab" class="active" onclick="showTab('home')"><span>⌂</span>Inicio</button><button id="chatTab" onclick="showTab('chat')"><span>▤</span>Chat</button></nav><audio id="radio" preload="none"></audio>
<script>
const DEFAULTS={apiUrl:"",stationName:"La Grande de Huétamo",brandTop:"LA GRANDE",brandBottom:"HUÉTAMO",accent:"#df1020",textColor:"#ffffff",streamUrl:"",logo:"",background:"",chatEnabled:true,chatUrl:"",chatMessage:"Comunícate con nosotros.",chatButtonLabel:"Abrir chat",footer:"Radio La Grande de Huétamo",links:[]};
let config={...DEFAULTS},audio=document.getElementById('radio'),playing=false;
function safeUrl(u){return /^https?:\\/\\//i.test(u||'')||/^mailto:/i.test(u||'')||/^tel:/i.test(u||'')}
function openExternal(url){if(!safeUrl(url))return;if(window.AndroidBridge)AndroidBridge.openExternal(url);else window.open(url,'_blank')}
function applyConfig(c){config={...DEFAULTS,...c};document.documentElement.style.setProperty('--accent',config.accent||'#df1020');document.getElementById('stationName').textContent=config.stationName||DEFAULTS.stationName;document.getElementById('brandTop').textContent=config.brandTop||'';document.getElementById('brandBottom').textContent=config.brandBottom||'';document.getElementById('footer').textContent=config.footer||'';document.getElementById('chatMessage').textContent=config.chatMessage||'';if(config.logo){let l=document.getElementById('logo');l.src=config.apiUrl?new URL(config.logo,config.apiUrl).href:config.logo;l.style.display='block'}else document.getElementById('logo').style.display='none';if(config.background)document.getElementById('bg').src=config.apiUrl?new URL(config.background,config.apiUrl).href:config.background;if(config.streamUrl)audio.src=config.streamUrl;const list=document.getElementById('links');list.innerHTML='';(config.links||[]).filter(x=>x.active).forEach(x=>{let a=document.createElement('a');a.className='link'+(x.wide?' wide':'');a.href='#';let ic=document.createElement('span');ic.className='ico';ic.textContent=x.icon||'●';let label=document.createElement('span');label.textContent=x.label||'Enlace';a.append(ic,label);a.onclick=()=>{openExternal(x.url);return false};list.append(a)});document.getElementById('chatTab').style.display=config.chatEnabled?'flex':'none'}
async function loadConfig(){if(!DEFAULTS.apiUrl)return;try{let r=await fetch(DEFAULTS.apiUrl+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();applyConfig(await r.json())}catch(e){document.getElementById('status').textContent='▣ Modo sin conexión · configuración local'}}
function toggleRadio(){if(!audio.src){document.getElementById('status').textContent='Configura el streaming en el panel.';return}if(!playing){audio.play().then(()=>{playing=true;playIcon.textContent='Ⅱ';playText.textContent='EN VIVO';status.textContent='● Reproduciendo en vivo'}).catch(()=>status.textContent='No se pudo iniciar el streaming.')}else{audio.pause();playing=false;playIcon.textContent='▶';playText.textContent='ESCUCHAR';status.textContent='▣ Listo para escuchar'}}
function showTab(t){homeView.style.display=t==='home'?'block':'none';chatView.style.display=t==='chat'?'block':'none';homeTab.classList.toggle('active',t==='home');chatTab.classList.toggle('active',t==='chat')}
function openChat(){if(config.chatUrl)openExternal(config.chatUrl);else chatMessage.textContent='El chat aún no tiene enlace configurado.';return false}
loadConfig();
</script></body></html>
